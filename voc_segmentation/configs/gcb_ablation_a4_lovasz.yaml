experiment:
  name: gcb_ablation_a4_lovasz_b1_384_voc_train
  stage: gcb_ablation
  ablation_id: A4
  comparison_group: gcb_a0_a4_voc_train_20k
  reference_a0: runs/segformer_b1_voc_train
model:
  name: gcb_seg
  encoder: mit_b1
  encoder_pretrained: imagenet1k
  encoder_weights_path: artifacts/weights/mit_b1_imagenet1k/mit_b1.pth
  decoder_channels: 256
  context_branch_channels: 64
  boundary_channels: 64
  num_classes: 21
  global_context_dilations: [1, 3, 6]
  use_global_pooling: true
  feature_fusion_mode: gated
  use_gated_fusion: true
  use_boundary_branch: true
  auxiliary_head: false
  dropout: 0.1
loss:
  ce_weight: 1.0
  lovasz_weight: 0.5
  edge_weight: 0.2
  aux_weight: 0.0
  label_smoothing: 0.0
data:
  train_split: train
  val_split: val
  crop_size: [384, 384]
  scale_range: [0.5, 2.0]
  horizontal_flip_probability: 0.5
  ignore_index: 255
  reduce_zero_label: false
training:
  physical_batch_size: 2
  effective_batch_size: 8
  gradient_accumulation_steps: 4
  optimizer: adamw
  encoder_lr: 0.00006
  decoder_lr: 0.00060
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  amp: true
  max_consecutive_amp_overflows: 4
  max_total_amp_overflows: 32
  seed: 42
  max_iterations: 20000
  validate_every: 1000
  warmup_iterations: 1500
  poly_power: 0.9
  num_workers: 0
  save_best_metric: miou
inference:
  scales: [1.0]
  horizontal_flip: false
  output_mode: L
  output_dtype: uint8
