experiment:
  name: gcb_seg_b1_384_voc_train
  stage: gcb_ablation
model:
  name: gcb_seg
  encoder: mit_b1
  encoder_pretrained: imagenet1k
  encoder_weights_path: artifacts/weights/mit_b1_imagenet1k/mit_b1.pth
  decoder_channels: 256
  context_branch_channels: 64
  boundary_channels: 64
  num_classes: 21
  global_context_dilations: [1, 3, 6]
  use_global_pooling: true
  use_gated_fusion: true
  feature_fusion_mode: gated
  use_boundary_branch: true
  auxiliary_head: true
  dropout: 0.1
data:
  train_split: train
  val_split: val
  crop_size: [384, 384]
  random_scale: [0.5, 2.0]
  horizontal_flip: 0.5
  cat_max_ratio: 0.75
  ignore_index: 255
  reduce_zero_label: false
optimizer:
  type: adamw
  encoder_lr: 0.00006
  decoder_lr: 0.00030
  weight_decay: 0.01
  grad_clip: 1.0
scheduler:
  type: warmup_poly
  warmup_iters: 1500
  power: 0.9
  max_iters: 40000
loss:
  ce_weight: 1.0
  lovasz_weight: 0.5
  edge_weight: 0.2
  aux_weight: 0.4
  label_smoothing: 0.05
training:
  physical_batch_size: 2
  effective_batch_size: 8
  gradient_accumulation_steps: 4
  amp: true
  max_consecutive_amp_overflows: 4
  max_total_amp_overflows: 32
  seed: 42
  num_workers: 0
  validate_every: 1000
  save_best_metric: miou
inference:
  scales: [0.75, 1.0, 1.25]
  horizontal_flip: true
  output_mode: L
  output_dtype: uint8
