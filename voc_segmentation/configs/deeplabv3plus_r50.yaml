experiment:
  name: deeplabv3plus_r50_voc_train
  stage: cnn_baseline
model:
  name: deeplabv3plus
  encoder: resnet50
  encoder_pretrained: imagenet1k_v2
  encoder_weights_path: artifacts/weights/resnet50_imagenet1k_v2/resnet50-11ad3fa6.pth
  num_classes: 21
data:
  train_split: train
  val_split: val
  crop_size: [384, 384]
  scale_range: [0.5, 2.0]
  horizontal_flip_probability: 0.5
  ignore_index: 255
  reduce_zero_label: false
training:
  physical_batch_size: 2
  effective_batch_size: 8
  gradient_accumulation_steps: 4
  optimizer: sgd
  base_lr: 0.01
  encoder_lr_multiplier: 0.1
  decoder_lr_multiplier: 1.0
  momentum: 0.9
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  amp: true
  seed: 42
  max_iterations: 20000
  validate_every: 1000
  warmup_iterations: 500
  poly_power: 0.9
  num_workers: 0
  save_best_metric: miou
